server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;
    root /usr/share/nginx/html;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets (prefix locations — no rewrite interference)
    location ^~ /css/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Legacy root styles stub (redirects to css/styles.css via @import)
    location = /styles.css {
        try_files /styles.css =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Short URL HTML pages → pages/
    location ~ ^/(index|login|profile|settings|car)\.html$ {
        try_files /pages/$1.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location ^~ /pages/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = / {
        try_files /pages/login.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /cars {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }
}
