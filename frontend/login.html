<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Car Flip Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page-body">
    <div class="login-shell">
        <div class="login-card">
            <p class="login-brand">CSS360 · Car Flip Marketplace</p>
            <h1 class="login-title">Sign in</h1>
            <p class="login-subtitle">
                UW Bothell students, faculty, and authorized staff only.
                Continue with your university Microsoft account.
            </p>
            <p id="loginError" class="login-error" role="alert" hidden></p>
            <div class="login-actions">
                <a class="btn-ms-signin" href="/api/auth/login">
                    <svg class="btn-ms-signin-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" aria-hidden="true">
                        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                    </svg>
                    <span>Sign in with Microsoft</span>
                </a>
            </div>
            <p class="login-footnote">
                Having trouble? Contact your course staff or
                <a class="login-link" href="https://www.uwb.edu/it" target="_blank" rel="noopener noreferrer">UW Bothell IT</a>.
            </p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
