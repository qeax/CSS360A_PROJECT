<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Car Flip Marketplace</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page-body">
    <button type="button" class="app-icon-btn login-theme-toggle" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
        <svg class="app-icon-btn-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
        <svg class="app-icon-btn-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
    </button>
    <div class="login-shell">
        <div class="login-card">
            <p class="login-brand">CSS360 · Car Flip Marketplace</p>
            <h1 class="login-title">Sign in</h1>
            <p class="login-subtitle">
                UW Bothell students, faculty, and authorized staff only.
                Continue with your university Microsoft account.
            </p>
            <p id="loginError" class="login-error" role="alert" hidden></p>
            <div class="login-actions">
                <a class="btn-ms-signin" href="/api/auth/login">
                    <svg class="btn-ms-signin-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" aria-hidden="true">
                        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                    </svg>
                    <span>Sign in with Microsoft</span>
                </a>
            </div>
            <p class="login-footnote">
                Having trouble? Contact your course staff or
                <a class="login-link" href="https://www.uwb.edu/it" target="_blank" rel="noopener noreferrer">UW Bothell IT</a>.
            </p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
