<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings · Car Flip CSS360</title>

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="/css/styles.css?v=20260604">

</head>

<body>

    <header class="app-topbar app-topbar--compact" role="banner">

        <a class="app-brand" href="/index.html" aria-label="Car Flip CSS360 home">

            <span class="app-brand-icon" aria-hidden="true">

                <svg class="app-brand-car" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" width="28" height="28" aria-hidden="true">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5.2c-.6 0-1.1.4-1.5.9l-1.4 2.6c-.3.5-.4 1-.4 1.5V16c0 .6.4 1 1 1h2" />

                    <circle cx="7" cy="17" r="2" stroke-linecap="round" stroke-linejoin="round" />

                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17h6" />

                    <circle cx="17" cy="17" r="2" stroke-linecap="round" stroke-linejoin="round" />

                </svg>

            </span>

            <span class="app-brand-text">Car Flip · CSS360</span>

        </a>

        <div class="app-topbar-spacer" aria-hidden="true"></div>

        <div class="app-topbar-actions">

            <div class="app-notifications-wrap">
                <button type="button" class="app-icon-btn" id="notificationsBtn" aria-label="Notifications" aria-expanded="false" aria-controls="notificationsPanel" title="Notifications">
                    <span class="app-notifications-badge" id="notificationsBadge" hidden></span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
                    </svg>
                </button>
                <div class="app-notifications-panel" id="notificationsPanel" hidden>
                    <div class="app-notifications-panel-header">
                        <span>Notifications</span>
                        <button type="button" class="app-notifications-read-all" id="notificationsReadAllBtn">Mark all read</button>
                    </div>
                    <div id="notificationsList"></div>
                </div>
            </div>

            <button type="button" class="app-icon-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">

                <svg class="app-icon-btn-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />

                </svg>

                <svg class="app-icon-btn-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />

                </svg>

            </button>

            <div class="app-account" id="appAccountWrap">

                <button type="button" class="app-account-trigger" id="accountMenuBtn" aria-expanded="false" aria-haspopup="true" aria-controls="accountMenu">

                    <span class="app-account-avatar-wrap">

                        <img class="app-account-avatar" id="accountAvatarImg" alt="" width="28" height="28" hidden>

                        <span class="app-account-avatar app-account-avatar--fallback" id="accountAvatarFallback" aria-hidden="true"></span>

                    </span>

                    <span class="app-account-label">

                        <span class="app-account-name" id="accountDisplayName">Account</span>

                        <span class="app-account-email" id="accountEmailLabel"></span>

                    </span>

                    <svg width="14" height="14" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 4l4 4 4-4z"/></svg>

                </button>

                <div class="app-account-menu" id="accountMenu" role="menu" hidden>

                    <a class="app-account-menu-item" role="menuitem" href="profile.html">Profile</a>

                    <a class="app-account-menu-item" role="menuitem" href="settings.html" aria-current="page">Settings</a>

                    <a class="app-account-menu-item app-account-menu-item--logout" role="menuitem" href="/api/auth/logout">Log out</a>

                </div>

            </div>

        </div>

    </header>



    <main class="profile-page">

        <a class="profile-back" href="index.html">← Back to inventory</a>

        <section class="profile-card" aria-labelledby="settingsHeading">

            <h1 class="profile-card-name" id="settingsHeading">Settings</h1>

            <p class="profile-card-email">Preferences are stored in this browser only.</p>

            <div class="settings-toggles">

                <label class="filter-toggle settings-toggle" for="showListingJsonDebug">

                    <input type="checkbox" id="showListingJsonDebug">

                    <span class="filter-toggle-ui" aria-hidden="true"></span>

                    <span class="filter-toggle-label">Show listing JSON debug button</span>

                </label>

                <label class="filter-toggle settings-toggle" for="showDeleteCarButton">

                    <input type="checkbox" id="showDeleteCarButton">

                    <span class="filter-toggle-ui" aria-hidden="true"></span>

                    <span class="filter-toggle-label">Show delete listing button</span>

                </label>

                <label class="filter-toggle settings-toggle" for="listingDetailPageMode">

                    <input type="checkbox" id="listingDetailPageMode" checked>

                    <span class="filter-toggle-ui" aria-hidden="true"></span>

                    <span class="filter-toggle-label">Open listings in full page (off = modal)</span>

                </label>

            </div>

            <div class="settings-actions">
                <button type="button" class="settings-test-notification-btn" id="sendTestNotificationBtn">Send test notification</button>
                <p class="settings-test-notification-hint">Preview only — nothing is saved to the database.</p>
            </div>

        </section>

    </main>



    <script src="/js/app-shell.js"></script>

    <script src="/js/settings.js?v=20260604"></script>

</body>

</html>
