<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Flip Marketplace</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css?v=20260606">
</head>
<body>
    <header class="app-topbar" role="banner">
        <a class="app-brand" href="/index.html" aria-label="Car Flip CSS360 home">
            <span class="app-brand-icon" aria-hidden="true">
                <svg class="app-brand-car" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" width="28" height="28" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5.2c-.6 0-1.1.4-1.5.9l-1.4 2.6c-.3.5-.4 1-.4 1.5V16c0 .6.4 1 1 1h2" />
                    <circle cx="7" cy="17" r="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 17h6" />
                    <circle cx="17" cy="17" r="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
            <span class="app-brand-text">Car Flip · CSS360</span>
        </a>
        <div class="app-topbar-search" role="search">
            <label class="visually-hidden" for="globalSearchInput">Search inventory</label>
            <input type="search" id="globalSearchInput" class="app-topbar-search-input" placeholder="Make, model, city, keywords…" autocomplete="off">
            <button type="button" class="app-topbar-search-btn" id="globalSearchBtn" aria-label="Run search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/>
                    <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <div class="app-topbar-actions">
            <div class="app-notifications-wrap">
                <button type="button" class="app-icon-btn" id="notificationsBtn" aria-label="Notifications" aria-expanded="false" aria-controls="notificationsPanel" title="Notifications">
                    <span class="app-notifications-badge" id="notificationsBadge" hidden></span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
                    </svg>
                </button>
                <div class="app-notifications-panel" id="notificationsPanel" hidden>
                    <div class="app-notifications-panel-header">
                        <span>Notifications</span>
                        <button type="button" class="app-notifications-read-all" id="notificationsReadAllBtn">Mark all read</button>
                    </div>
                    <div id="notificationsList"></div>
                </div>
            </div>
            <button type="button" class="app-icon-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
                <svg class="app-icon-btn-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
                <svg class="app-icon-btn-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                </svg>
            </button>
            <div class="app-account" id="appAccountWrap">
                <button type="button" class="app-account-trigger" id="accountMenuBtn" aria-expanded="false" aria-haspopup="true" aria-controls="accountMenu">
                    <span class="app-account-avatar-wrap">
                        <img class="app-account-avatar" id="accountAvatarImg" alt="" width="28" height="28" hidden>
                        <span class="app-account-avatar app-account-avatar--fallback" id="accountAvatarFallback" aria-hidden="true"></span>
                    </span>
                    <span class="app-account-label">
                        <span class="app-account-name" id="accountDisplayName">Account</span>
                        <span class="app-account-email" id="accountEmailLabel"></span>
                    </span>
                    <svg width="14" height="14" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 4l4 4 4-4z"/></svg>
                </button>
                <div class="app-account-menu" id="accountMenu" role="menu" hidden>
                    <a class="app-account-menu-item" role="menuitem" href="profile.html">Profile</a>
                    <a class="app-account-menu-item" role="menuitem" href="settings.html">Settings</a>
                    <a class="app-account-menu-item app-account-menu-item--logout" role="menuitem" href="/api/auth/logout">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <div class="app-main">
        <aside class="filters-sidebar" aria-label="Inventory filters">
            <div class="filters-sidebar-header">
                <h2 class="filters-sidebar-title">Filter</h2>
                <button type="button" class="filters-reset-btn" id="resetFiltersBtn">Reset</button>
            </div>
            <div class="filters-sidebar-scroll">
                <section class="filter-section" data-filter-key="location" hidden>
                    <h3 class="filter-heading">Location</h3>
                    <div class="input-group filter-dropdown" data-loc-tier="country">
                        <span class="filter-dropdown-label" id="filterCountryLabel">Country</span>
                        <button type="button" class="filter-dropdown-trigger" id="filterCountryBtn" aria-expanded="false" aria-haspopup="true" aria-controls="filterCountryPanel" aria-labelledby="filterCountryLabel">Any</button>
                        <div class="filter-dropdown-panel" id="filterCountryPanel" hidden>
                            <div class="filter-dropdown-scroll" id="filterCountryChecks"></div>
                            <button type="button" class="filter-dropdown-done">Done</button>
                        </div>
                    </div>
                    <div class="input-group filter-dropdown filter-loc-tier--region" data-loc-tier="region">
                        <span class="filter-dropdown-label" id="filterRegionLabel">Region / state</span>
                        <button type="button" class="filter-dropdown-trigger" id="filterRegionBtn" aria-expanded="false" aria-haspopup="true" aria-controls="filterRegionPanel" aria-labelledby="filterRegionLabel" disabled>Select country first</button>
                        <div class="filter-dropdown-panel" id="filterRegionPanel" hidden>
                            <div class="filter-dropdown-scroll" id="filterRegionChecks"></div>
                            <button type="button" class="filter-dropdown-done">Done</button>
                        </div>
                    </div>
                    <div class="input-group filter-dropdown filter-loc-tier--city" data-loc-tier="city">
                        <span class="filter-dropdown-label" id="filterCityLabel">City</span>
                        <button type="button" class="filter-dropdown-trigger" id="filterCityBtn" aria-expanded="false" aria-haspopup="true" aria-controls="filterCityPanel" aria-labelledby="filterCityLabel" disabled>Select region first</button>
                        <div class="filter-dropdown-panel" id="filterCityPanel" hidden>
                            <div class="filter-dropdown-scroll" id="filterCityChecks"></div>
                            <button type="button" class="filter-dropdown-done">Done</button>
                        </div>
                    </div>
                    <div class="input-group filter-radius-wrap" id="radiusFilterWrap">
                        <label for="filterRadiusMi">Radius from selected city (mi)</label>
                        <input type="range" id="filterRadiusMi" min="5" max="300" value="50" step="5">
                        <div class="range-value-row"><span id="filterRadiusMiLabel">50</span> mi</div>
                    </div>
                </section>
                <hr class="filter-divider" data-filter-key="location" hidden>
                <section class="filter-section" data-filter-key="price" hidden>
                    <h3 class="filter-heading">Price</h3>
                    <div class="dual-range" data-dual-range="price">
                        <input type="range" id="filterPriceMin" class="dual-range-input dual-range-input--min" min="0" max="100000" value="0" step="100">
                        <input type="range" id="filterPriceMax" class="dual-range-input dual-range-input--max" min="0" max="100000" value="100000" step="100">
                        <div class="dual-range-track" aria-hidden="true"></div>
                    </div>
                    <div class="range-value-row">
                        <span id="filterPriceMinLabel">$0</span> – <span id="filterPriceMaxLabel">$0</span>
                    </div>
                </section>
                <hr class="filter-divider" data-filter-key="price" hidden>
                <section class="filter-section" data-filter-key="year" hidden>
                    <h3 class="filter-heading">Year</h3>
                    <div class="dual-range" data-dual-range="year">
                        <input type="range" id="filterYearMin" class="dual-range-input dual-range-input--min" min="1990" max="2030" value="1990" step="1">
                        <input type="range" id="filterYearMax" class="dual-range-input dual-range-input--max" min="1990" max="2030" value="2030" step="1">
                        <div class="dual-range-track" aria-hidden="true"></div>
                    </div>
                    <div class="range-value-row">
                        <span id="filterYearMinLabel">1990</span> – <span id="filterYearMaxLabel">2030</span>
                    </div>
                </section>
                <hr class="filter-divider" data-filter-key="year" hidden>
                <section class="filter-section" data-filter-key="mileage" hidden>
                    <h3 class="filter-heading">Mileage (mi)</h3>
                    <div class="dual-range" data-dual-range="mileage">
                        <input type="range" id="filterMileageMin" class="dual-range-input dual-range-input--min" min="0" max="200000" value="0" step="500">
                        <input type="range" id="filterMileageMax" class="dual-range-input dual-range-input--max" min="0" max="200000" value="200000" step="500">
                        <div class="dual-range-track" aria-hidden="true"></div>
                    </div>
                    <div class="range-value-row">
                        <span id="filterMileageMinLabel">0</span> – <span id="filterMileageMaxLabel">200000</span> mi
                    </div>
                </section>
                <hr class="filter-divider" data-filter-key="mileage" hidden>
                <section class="filter-section" data-filter-key="make" hidden>
                    <h3 class="filter-heading">Make</h3>
                    <div class="input-group filter-dropdown" data-loc-tier="make" data-filter="make">
                        <span class="filter-dropdown-label" id="filterMakeLabel">Make</span>
                        <button type="button" class="filter-dropdown-trigger" id="filterMakeBtn" aria-expanded="false" aria-haspopup="true" aria-controls="filterMakePanel" aria-labelledby="filterMakeLabel">Any</button>
                        <div class="filter-dropdown-panel" id="filterMakePanel" hidden>
                            <div class="filter-dropdown-scroll" id="filterMakeChecks"></div>
                            <button type="button" class="filter-dropdown-done">Done</button>
                        </div>
                    </div>
                </section>
                <hr class="filter-divider" data-filter-key="make" hidden>
                <section class="filter-section" data-filter-key="body" hidden>
                    <h3 class="filter-heading">Body type</h3>
                    <div class="chip-group" id="filterBodyTypes" role="group" aria-label="Body types"></div>
                </section>
                <hr class="filter-divider" data-filter-key="body" hidden>
                <section class="filter-section" data-filter-key="delivery" hidden>
                    <h3 class="filter-heading">Delivery</h3>
                    <div class="chip-group" id="filterDelivery" role="group" aria-label="Delivery options"></div>
                </section>
                <hr class="filter-divider" data-filter-key="delivery" hidden>
                <section class="filter-section" data-filter-key="condition" hidden>
                    <h3 class="filter-heading">Condition</h3>
                    <div class="chip-group" id="filterConditions" role="group" aria-label="Condition"></div>
                </section>
                <hr class="filter-divider" data-filter-key="condition" hidden>
                <section class="filter-section" data-filter-key="format" hidden>
                    <h3 class="filter-heading">Buying format</h3>
                    <div class="chip-group" id="filterListingFormats" role="group" aria-label="Listing format"></div>
                </section>
                <hr class="filter-divider" data-filter-key="format" hidden>
                <section class="filter-section" data-filter-key="title" hidden>
                    <h3 class="filter-heading">Vehicle title</h3>
                    <div class="chip-group" id="filterVehicleTitles" role="group" aria-label="Vehicle title"></div>
                </section>
                <hr class="filter-divider" data-filter-key="title" hidden>
                <section class="filter-section" data-filter-key="profitability">
                    <h3 class="filter-heading">Profitability</h3>
                    <label class="filter-toggle" for="filterExcludeNegativeProfit">
                        <input type="checkbox" id="filterExcludeNegativeProfit">
                        <span class="filter-toggle-ui" aria-hidden="true"></span>
                        <span class="filter-toggle-label">Hide negative net profit</span>
                    </label>
                    <label class="filter-toggle" for="filterExcludeEndedAuctions">
                        <input type="checkbox" id="filterExcludeEndedAuctions" checked>
                        <span class="filter-toggle-ui" aria-hidden="true"></span>
                        <span class="filter-toggle-label">Hide ended auctions</span>
                    </label>
                    <label class="filter-toggle" for="filterExcludeUnknownPrice">
                        <input type="checkbox" id="filterExcludeUnknownPrice">
                        <span class="filter-toggle-ui" aria-hidden="true"></span>
                        <span class="filter-toggle-label">Hide listings without price</span>
                    </label>
                    <div class="input-group"><label for="filterMinRoi">Min ROI %</label><input type="number" id="filterMinRoi" placeholder="Any" step="0.1" min="0"></div>
                    <div class="input-group"><label for="filterMinProfit">Min net profit ($)</label><input type="number" id="filterMinProfit" placeholder="Any" step="100"></div>
                </section>
            </div>
            <div class="filters-sidebar-footer">
                <button type="button" class="btn-apply-filters" id="applyFiltersBtn">Apply filters</button>
            </div>
        </aside>

        <div class="inventory-main">
            <div class="inventory-toolbar-strip" role="region" aria-label="Sort and layout">
                <span class="sort-controls-label" id="sortControlsLabel">Sort by:</span>
                <select id="frontendSortBy" class="toolbar-select toolbar-select--sort" aria-labelledby="sortControlsLabel">
                    <option value="roi">ROI %</option>
                    <option value="net_profit">Net profit</option>
                    <option value="price">Purchase price</option>
                </select>
                <button type="button" class="sort-order-toggle" id="sortOrderToggle" aria-label="Sort direction: descending" title="Toggle sort order">
                    <svg class="sort-order-icon sort-order-icon--desc" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 5v14M12 19l-4-4M12 19l4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="sort-order-icon sort-order-icon--asc" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12 19V5M12 5l4 4M12 5l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="view-toggle" role="group" aria-label="Inventory layout">
                    <button type="button" class="view-toggle-btn" id="viewListBtn" aria-label="List view" aria-pressed="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button type="button" class="view-toggle-btn" id="viewGridBtn" aria-label="Grid view" aria-pressed="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="inventory-results-hint" id="inventoryResultsHint" aria-live="polite"></p>
            <div id="inventoryList" class="inventory-list"></div>
            <div class="inventory-load-more" id="inventoryLoadMoreWrap" hidden>
                <button type="button" class="btn-load-more" id="loadMoreBtn">Load more</button>
            </div>
        </div>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-box">
            <h2 id="modalHeader" class="modal-header-title"></h2>
            <div id="modalContent"></div>
            <button type="button" id="closeModalBtn" class="modal-close-btn">Close</button>
        </div>
    </div>

    <div id="confirmModal" class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle" hidden>
        <div class="modal-box confirm-modal-box">
            <h2 id="confirmModalTitle" class="confirm-modal-title"></h2>
            <p id="confirmModalMessage" class="confirm-modal-message"></p>
            <div class="confirm-modal-actions">
                <button type="button" class="confirm-modal-btn confirm-modal-btn--cancel" id="confirmModalCancelBtn">Cancel</button>
                <button type="button" class="confirm-modal-btn confirm-modal-btn--confirm" id="confirmModalConfirmBtn">Delete</button>
            </div>
        </div>
    </div>

    <div id="appToastStack" class="app-toast-stack" aria-live="polite" aria-relevant="additions"></div>

    <script src="/js/app-shell.js?v=20260609"></script>
    <script src="/js/listing-shared.js?v=20260610"></script>
    <script src="/js/script.js?v=20260609"></script>
</body>
</html>
