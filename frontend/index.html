<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Flip Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="marketplace-container">
        <div class="header-controls">
            <h2 class="page-title">Car Flip Dashboard</h2>
            <div class="header-actions">
                <button type="button" class="theme-toggle" id="logoutBtn">Log out</button>
                <button type="button" class="theme-toggle" id="themeToggleBtn">Toggle Theme</button>
            </div>
        </div>

        <div class="inventory-toolbar">
            <div class="toolbar-row toolbar-row--filters">
                <div class="search-header">
                    <div class="search-grid">
                        <div class="input-group"><label>Make</label><input type="text" id="makeSearch" placeholder="Toyota, Honda..."></div>
                        <div class="input-group"><label>Model</label><input type="text" id="modelSearch" placeholder="Camry, Civic..."></div>
                        <div class="input-group"><label>Max Price</label><input type="number" id="maxPrice" placeholder="20000"></div>
                    </div>
                    <div class="action-row action-row--filters">
                        <button type="button" class="btn-search" id="searchBtn">Search Inventory</button>
                        <button type="button" class="btn-reset" id="resetFiltersBtn">Reset filters</button>
                    </div>
                </div>
            </div>
            <div class="toolbar-row toolbar-row--controls">
                <div class="sort-controls">
                    <span class="sort-controls-label" id="sortControlsLabel">Sort results</span>
                    <select id="frontendSortBy" class="toolbar-select" aria-labelledby="sortControlsLabel">
                        <option value="roi">ROI %</option>
                        <option value="net_profit">Net Profit</option>
                        <option value="price">Purchase Price</option>
                    </select>
                    <select id="frontendSortOrder" class="toolbar-select" aria-labelledby="sortControlsLabel">
                        <option value="desc">Highest First</option>
                        <option value="asc">Lowest First</option>
                    </select>
                    <div class="view-toggle" role="group" aria-label="Inventory layout">
                        <button type="button" class="view-toggle-btn" id="viewListBtn" aria-label="List view" aria-pressed="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <button type="button" class="view-toggle-btn" id="viewGridBtn" aria-label="Grid view" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                                <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="inventoryList" class="inventory-list"></div>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-box">
            <h2 id="modalHeader" style="color: var(--accent-green); margin-top:0;"></h2>
            <div id="modalContent"></div>
            <button id="closeModalBtn" style="margin-top: 20px; width: 100%; padding: 12px; border:none; background: #e2e8f0; border-radius: 8px; cursor:pointer; font-weight: 600;">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
