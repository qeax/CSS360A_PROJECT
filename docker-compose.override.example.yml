# Copy to `docker-compose.override.yml` in the repo root (that file is gitignored).
# Docker Compose merges it automatically for local dev. Do not commit the real override.
# Production on Ubuntu should run without this file (Traefik + published image only).
#
# Also copy `.env.example` → `.env` and set DEV_AUTH_BYPASS=true (see Readme.md — Local development).

services:
  backend:
    ports:
      - "8000:8000"
  frontend:
    ports:
      - "8080:80"
