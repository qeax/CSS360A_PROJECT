<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>eBay Car Search - Local Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
    h1 { color: #e53935; }
    .search-box { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    input, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #e53935; color: white; border: none; cursor: pointer; }
    button:hover { background: #c62828; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; background: #eee; }
    .card h3 { margin: 10px 0 5px; font-size: 18px; }
    .price { font-size: 20px; font-weight: bold; color: #2e7d32; }
    .meta { color: #666; font-size: 14px; margin: 5px 0; }
    .error { color: #c62828; background: #ffebee; padding: 10px; border-radius: 4px; }
    .loading { text-align: center; padding: 20px; color: #666; }
  </style>
</head>
<body>
  <h1>🚗 eBay Car Search (Sandbox)</h1>
  
  <div class="search-box">
    <input type="text" id="query" placeholder="Search cars (e.g., Toyota Camry)" value="Toyota Camry" />
    <input type="number" id="maxPrice" placeholder="Max price (optional)" min="0" />
    <button onclick="searchCars()">Search eBay</button>
    <button onclick="clearResults()">Clear</button>
  </div>

  <div id="results" class="results"></div>

  <script>
    const API_BASE = 'http://localhost:8000/api/ebay';

    async function searchCars() {
      const query = document.getElementById('query').value.trim();
      const maxPrice = document.getElementById('maxPrice').value;
      const resultsDiv = document.getElementById('results');
      
      if (!query) {
        alert('Please enter a search query');
        return;
      }

      resultsDiv.innerHTML = '<div class="loading">Searching eBay...</div>';
      
      try {
        let url = `${API_BASE}/search?query=${encodeURIComponent(query)}&limit=10`;
        if (maxPrice) url += `&max_price=${maxPrice}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.success) {
          resultsDiv.innerHTML = `<div class="error">❌ ${data.detail || 'Search failed'}</div>`;
          return;
        }
        
        if (data.count === 0) {
          resultsDiv.innerHTML = '<div class="loading">No listings found. Try a broader query like "car" or "vehicle".</div>';
          return;
        }
        
        resultsDiv.innerHTML = data.results.map(item => {
          if (item.error) return `<div class="error">⚠️ ${item.error}</div>`;
          
          return `
            <div class="card">
              ${item.image_url ? `<img src="${item.image_url}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/280x180?text=No+Image'">` : ''}
              <h3>${item.title || 'Untitled'}</h3>
              ${item.price ? `<div class="price">$${Number(item.price).toLocaleString()} ${item.currency || ''}</div>` : ''}
              ${item.condition ? `<div class="meta">Condition: ${item.condition}</div>` : ''}
              ${item.location_city ? `<div class="meta">Location: ${item.location_city}</div>` : ''}
              ${item.listing_url ? `<div style="margin-top:10px"><a href="${item.listing_url}" target="_blank" style="color:#e53935">View on eBay →</a></div>` : ''}
            </div>
          `;
        }).join('');
        
      } catch (err) {
        resultsDiv.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
        console.error('Search error:', err);
      }
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
      document.getElementById('query').value = '';
      document.getElementById('maxPrice').value = '';
    }

    // Auto-search on load for demo
    window.onload = searchCars;
  </script>
</body>
</html>
