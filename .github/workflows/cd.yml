name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          SEED_ON_START: ${{ secrets.SEED_ON_START }}
          PURGE_DEMO_ON_START: ${{ secrets.PURGE_DEMO_ON_START }}
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
          AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          AZURE_AD_REDIRECT_URI: ${{ secrets.AZURE_AD_REDIRECT_URI }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          ALLOWED_EMAIL_DOMAIN: ${{ secrets.ALLOWED_EMAIL_DOMAIN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          APP_PUBLIC_HOST: ${{ secrets.APP_PUBLIC_HOST }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_SANDBOX: ${{ secrets.EBAY_SANDBOX }}
          EBAY_DEFAULT_QUERY: ${{ secrets.EBAY_DEFAULT_QUERY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_ENV,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,MYSQL_ROOT_PASSWORD,SEED_ON_START,PURGE_DEMO_ON_START,AZURE_AD_TENANT_ID,AZURE_AD_CLIENT_ID,AZURE_AD_CLIENT_SECRET,AZURE_AD_REDIRECT_URI,AUTH_SESSION_SECRET,ALLOWED_EMAIL_DOMAIN,CORS_ORIGINS,APP_PUBLIC_HOST,EBAY_CLIENT_ID,EBAY_CLIENT_SECRET,EBAY_SANDBOX,EBAY_DEFAULT_QUERY
          script: |
            set -e
            
            cd /home/ubuntu/projects/css360

            cat > .env <<EOF
            APP_ENV=${APP_ENV}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            SEED_ON_START=${SEED_ON_START}
            PURGE_DEMO_ON_START=${PURGE_DEMO_ON_START}
            AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
            AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
            AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
            AZURE_AD_REDIRECT_URI=${AZURE_AD_REDIRECT_URI}
            AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET}
            ALLOWED_EMAIL_DOMAIN=${ALLOWED_EMAIL_DOMAIN}
            CORS_ORIGINS=${CORS_ORIGINS}
            APP_PUBLIC_HOST=${APP_PUBLIC_HOST}
            EBAY_CLIENT_ID=${EBAY_CLIENT_ID}
            EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET}
            EBAY_SANDBOX=${EBAY_SANDBOX}
            EBAY_DEFAULT_QUERY=${EBAY_DEFAULT_QUERY}
            EOF
            
            docker network inspect proxy_network >/dev/null 2>&1 || docker network create proxy_network
            
            docker compose down --remove-orphans
            
            git pull origin main
            
            docker compose up -d --build --force-recreate
            
            echo "=== Deployment Status ==="
            docker compose ps

            echo "=== Smoke Checks (backend loopback, bypasses Traefik) ==="
            ok=0
            max_attempts=10
            for attempt in $(seq 1 $max_attempts); do
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()" 2>/dev/null; then
                ok=1
                break
              fi
              echo "Health check attempt ${attempt}/${max_attempts} failed (backend may still be starting or crash-looping), waiting 5s..."
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "=== Backend logs (last 200 lines) ==="
              docker compose logs backend --tail=200 || true
              echo "=== DB logs (last 80 lines) ==="
              docker compose logs db --tail=80 || true
              exit 1
            fi

            docker compose exec -T backend python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); print(r.read().decode())"
            
            echo "=== Recent Logs ==="
            docker compose logs --tail=50