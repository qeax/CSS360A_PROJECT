# Optional local hooks: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/(app|tests|alembic)/

      - id: ruff-format
        files: ^backend/(app|tests|alembic)/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, backend/app, -ll]
        pass_filenames: false

  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args:
          - -r
          - backend/requirements.txt
          - -r
          - backend/requirements-dev.txt
          # Disputed advisory (key length is app responsibility); no fixed release yet.
          - --ignore-vuln
          - PYSEC-2025-183
        pass_filenames: false
