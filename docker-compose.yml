services:
    backend:
        build: ./backend
        container_name: css360_backend
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ./.env
        environment:
            SEED_ON_START: ${SEED_ON_START:-false}
            PURGE_DEMO_ON_START: ${PURGE_DEMO_ON_START:-false}
            INVENTORY_MODE: ${INVENTORY_MODE:-ebay_only}
            DEMO_IN_MEMORY_WHEN_EMPTY: ${DEMO_IN_MEMORY_WHEN_EMPTY:-false}
            EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
            EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
            EBAY_SANDBOX: ${EBAY_SANDBOX:-true}
            EBAY_DEFAULT_QUERY: ${EBAY_DEFAULT_QUERY:-car}
            EBAY_CATEGORY_IDS: ${EBAY_CATEGORY_IDS:-6001}
            EBAY_SEARCH_LIMIT: ${EBAY_SEARCH_LIMIT:-50}
            EBAY_SEARCH_PAGES: ${EBAY_SEARCH_PAGES:-2}
            EBAY_GET_ITEM_MAX: ${EBAY_GET_ITEM_MAX:-12}
        networks:
            - css360_internal
            - proxy_network
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
                ]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 45s
        labels:
            - "traefik.enable=true"
            # Router for backend: catching everything from the path /api/
            - "traefik.http.routers.css360-backend.rule=Host(`${APP_PUBLIC_HOST}`) && PathPrefix(`/api`)"
            - "traefik.http.routers.css360-backend.entrypoints=websecure"
            - "traefik.http.routers.css360-backend.tls.certresolver=letsencrypt"
            - "traefik.http.services.css360-backend.loadbalancer.server.port=8000"
            - "traefik.http.middlewares.css360-strip.stripprefix.prefixes=/api"
            - "traefik.http.routers.css360-backend.middlewares=css360-strip"
            # priority higher than frontend, so Traefik can initially find API
            - "traefik.http.routers.css360-backend.priority=2"

    frontend:
        image: nginx:alpine
        container_name: css360_frontend
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - css360_internal
            - proxy_network
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
            - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        labels:
            - "traefik.enable=true"
            # Router for frontend: everything else
            - "traefik.http.routers.css360-frontend.rule=Host(`${APP_PUBLIC_HOST}`)"
            - "traefik.http.routers.css360-frontend.entrypoints=websecure"
            - "traefik.http.routers.css360-frontend.tls.certresolver=letsencrypt"
            - "traefik.http.services.css360-frontend.loadbalancer.server.port=80"
            # Priority lower
            - "traefik.http.routers.css360-frontend.priority=1"
      
    db:
        image: mariadb:10.11
        container_name: css360_db
        restart: unless-stopped
        env_file:
            - ./.env
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - mariadb_data:/var/lib/mysql
        networks:
            - css360_internal
            - proxy_network
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 60s

volumes:
    mariadb_data:
    

networks:
    # Compose-assigned DNS (service names like `backend`, `db`) — fixes nginx→backend 502
    # when only an external network was used on some Docker Desktop setups.
    css360_internal:
        driver: bridge
    proxy_network:
        external: true
